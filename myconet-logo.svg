<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#111111" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Hexagon outline -->
    <polygon points="177.9,55 100,10 22.1,55 22.1,145 100,190 177.9,145" />
    <!-- Three inner lines from centre to alternating tips (the cube) -->
    <line x1="100" y1="100" x2="100" y2="10" />
    <line x1="100" y1="100" x2="22.1" y2="145" />
    <line x1="100" y1="100" x2="177.9" y2="145" />
  </g>
</svg>
